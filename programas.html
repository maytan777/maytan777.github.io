<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MM Ingeniería — Programas</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="script.js" defer></script>
  <script src="mascota.js" defer></script>
  <script src="programas-catalog.js" defer></script>
  <style>
    .prog-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
      min-width: 0;
      position: relative;
      transition: border-color 0.25s, background 0.25s, transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
      overflow: hidden;
    }
    .prog-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 0;
      background: var(--celeste);
      transition: height 0.3s;
    }
    .prog-card:hover::before { height: 100%; }
    .prog-card:hover {
      border-color: rgba(79,195,247,0.35);
      background: #000000;
      box-shadow: var(--glow);
      transform: translateY(-4px);
    }
    .prog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.6rem;
    }
    .prog-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--celeste);
    }
    .prog-icon svg { width: 20px; height: 20px; }
    .prog-badge {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--accent2);
      color: var(--accent2);
      text-transform: uppercase;
    }
    .prog-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
      overflow-wrap: anywhere;
    }
    .prog-info {
      font-family: var(--font-body);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0;
      margin: 0.25rem 0 0.8rem;
    }
    .prog-mono {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 26px;
      height: 26px;
      object-fit: contain;
      opacity: 0.55;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .prog-card:hover .prog-mono { opacity: 0.9; }
    .btn-download svg { width: 15px; height: 15px; }
    .catalog-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }
    .catalog-search { width: min(100%, 390px); }
    .catalog-search label { display: block; margin-bottom: 0.3rem; font-size: 0.75rem; color: var(--muted); }
    .catalog-search input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    #catalog-status { color: var(--muted); font-size: 0.75rem; }
    .prog-card[hidden], .catalog-empty[hidden], .catalog-block[hidden] { display: none; }
    .catalog-empty { padding: 1rem 0; color: var(--muted); font-size: 0.85rem; }
    .catalog-block { margin-bottom: 2.5rem; }
    .catalog-block:last-of-type { margin-bottom: 0; }
    .catalog-block .section-title { margin-bottom: 0.5rem; }
    .catalog-note {
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 1.1rem;
    }
    .top-tag {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.28em 0.6em;
      border: 1px solid var(--accent);
      color: var(--accent);
      vertical-align: middle;
      transform: translateY(-0.2em);
      margin-left: 0.35rem;
    }
    .prog-card-top { border-color: rgba(18,189,146,0.35); }
    .prog-card-top::before { background: var(--accent); height: 100%; }
    .prog-card-top .prog-icon { color: var(--accent); border-color: rgba(18,189,146,0.4); }
    .prog-card-top:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">MM<span>.</span>Ingeniería</a>
    <ul>
      <li><a href="index.html">Blog</a></li>
      <li><a href="programas.html" class="active">Programas</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Programas<br><em>y recursos</em></h1>
    <div class="hero-line"></div>
  </section>

  <div class="section">
    <div class="catalog-tools">
      <div class="catalog-search">
        <label for="program-search">Buscar programa</label>
        <input id="program-search" type="search" placeholder="Nombre del programa…" aria-controls="program-catalog-top program-catalog" autocomplete="off">
      </div>
      <p id="catalog-status" role="status">Cargando catálogo…</p>
    </div>

    <section class="catalog-block" id="catalog-top" aria-labelledby="top-title">
      <h2 class="section-title" id="top-title">Programas <span class="top-tag">Top</span></h2>
      <p class="catalog-note">Los más completos y usados, listos para descargar.</p>
      <div class="cards-grid" id="program-catalog-top"></div>
    </section>

    <section class="catalog-block" id="catalog-rest" aria-labelledby="rest-title">
      <h2 class="section-title" id="rest-title">Todos los programas</h2>
      <div class="cards-grid" id="program-catalog"></div>
    </section>

    <p class="catalog-empty" id="catalog-empty" hidden>No hay programas que coincidan con tu búsqueda.</p>
    <noscript><p class="catalog-empty">Activa JavaScript para ver los programas y sus enlaces de descarga.</p></noscript>
  </div>

  <footer><p>© 2026 <span>MM INGENIERIA</span> · Blog BIM & Construcción · Perú</p></footer>
  <a class="wa-float" href="https://wa.me/51957860293" target="_blank" title="Escríbeme por WhatsApp">💬</a>

  <script>
    (function () {
      function scan() {
        var els = document.querySelectorAll('.prog-card');
        if (!('IntersectionObserver' in window)) {
          els.forEach(function (el) { el.classList.add('visible'); });
          return;
        }
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) { en.target.classList.add('visible'); io.unobserve(en.target); }
          });
        }, { threshold: 0.12 });
        els.forEach(function (el) {
          if (el.classList.contains('visible')) return;
          el.classList.add('reveal');
          io.observe(el);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scan);
      } else { scan(); }
    })();
  </script>
</body>
</html>
